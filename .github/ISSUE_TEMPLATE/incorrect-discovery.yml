name: Incorrect discovery
description: Report a wrong, incomplete, or build-specific database claim.
title: "[Correction]: "
labels: [correction]
body:
  - type: input
    id: record
    attributes: { label: Record ID }
    validations: { required: true }
  - type: input
    id: build
    attributes: { label: Tested build and module hash }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Documented behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual behavior and reproduction steps }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: Non-proprietary evidence }
  - type: checkboxes
    id: compliance
    attributes:
      label: Repository integrity
      options:
        - label: I have not attached proprietary game files, assets, credentials, personal data, or unredacted dumps.
          required: true
